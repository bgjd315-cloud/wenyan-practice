<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文言文練習場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;900&display=swap">
<style>
:root{--bg:#f5f0e6;--paper:#fffcf5;--ink:#2b2622;--muted:#7a6f64;--line:#e3d9c8;--accent:#a23b2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1916;--paper:#24211d;--ink:#ece6dd;--muted:#a59a8d;--line:#3a352f;--accent:#e08a74}}
:root[data-theme="dark"]{--bg:#1b1916;--paper:#24211d;--ink:#ece6dd;--muted:#a59a8d;--line:#3a352f;--accent:#e08a74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PMingLiU",serif;line-height:1.8}
.wrap{max-width:980px;margin:0 auto;padding:40px 16px 60px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:.18em;margin:0;text-align:center}
.sub{text-align:center;color:var(--muted);margin:6px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(70,45,20,.15)}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.body{padding:16px 20px 20px}
.body b{font-size:1.4rem;letter-spacing:.1em}
.body .meta{color:var(--muted);font-size:.92rem}
.go{display:inline-block;margin-top:10px;color:var(--accent);font-weight:900}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:36px}
</style>
</head>
<body>
<div class="wrap">
  <h1>文言文練習場</h1>
  <p class="sub">歷屆真題．原題截圖．白話翻譯．逐項解析</p>
  <div class="grid">
    <a class="card" href="site/index.html"><img src="site/art/hero.png" alt="">
      <div class="body"><b>國中版</b><div class="meta">基測 90 年 ～ 會考 115 年，568 題</div><span class="go">進入練習 →</span></div></a>
    <a class="card" href="hs/site/index.html"><img src="hs/site/art/hero.png" alt="">
      <div class="body"><b>高中版</b><div class="meta">學測 101～115．指考 101～110，503 題（含多選、非選）</div><span class="go">進入練習 →</span></div></a>
  </div>
  <footer>題目來源：心測中心、大考中心公布之歷屆試題　｜　僅供課堂練習使用</footer>
</div>
</body>
</html>
